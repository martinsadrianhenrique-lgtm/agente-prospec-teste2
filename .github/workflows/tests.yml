name: Testes do CRM
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: prospector_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Testes SQLite
        if: matrix.database == 'sqlite'
        run: python -m pytest -q
      - name: Testes PostgreSQL
        if: matrix.database == 'postgres'
        env:
          TEST_POSTGRES_URL: postgresql://postgres:test_only_password@localhost:5432/prospector_test
        run: python -m pytest -q
